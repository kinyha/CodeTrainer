name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test progress tooling
        run: tests/tooling/progress-test.sh
      - name: Build and test
        run: ./gradlew build -PnoDocker --no-daemon

  integration:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Docker
        run: docker info
      - name: Run PostgreSQL integration tests
        run: ./gradlew :integration-drills:integrationTest :spring-drills:integrationTest --no-daemon
